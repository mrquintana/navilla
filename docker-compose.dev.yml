# Navilla Docker Compose - Development Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # Backend with volume mounts for development
  backend:
    build:
      context: ./backend
      target: builder  # Use builder stage for dev
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/target:/app/target
    environment:
      - SPRING_PROFILES_ACTIVE=development
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
    command: ["./mvnw", "spring-boot:run", "-Dspring-boot.run.jvmArguments=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"]
    ports:
      - "8080:8080"
      - "5005:5005"  # Debug port

  # Frontend with Vite dev server
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Anonymous volume for node_modules
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    ports:
      - "5173:5173"
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
      - VITE_API_URL=http://localhost:8080
