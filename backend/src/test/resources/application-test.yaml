spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://test.supabase.co/auth/v1/.well-known/jwks.json

navilla:
  encryption:
    pepper: test-pepper-for-unit-tests
  supabase:
    url: https://test.supabase.co
  privacy:
    minimum-connections: 1
  exposure:
    max-depth: 3
    snapshot-ttl-days: 1
  storage:
    public-base-url: https://test.supabase.co/storage/v1/object/public
    avatar-bucket: avatars
