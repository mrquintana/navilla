# Navilla Backend - Production Configuration
# Profile: production
# Usage: java -jar app.jar --spring.profiles.active=production

spring:
  # Database - Supabase production project
  datasource:
    url: ${DATABASE_URL}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      data-source-properties:
        prepareThreshold: 0

  # JPA - strict validation, no changes
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        generate_statistics: false
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

# Logging - production levels
logging:
  level:
    root: WARN
    app.navilla: INFO
    org.springframework: WARN
    org.springframework.security: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"

# Management endpoints - minimal exposure
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

  # OTLP metrics export — enabled in production via env vars
  otlp:
    metrics:
      export:
        enabled: ${OTLP_METRICS_ENABLED:false}
        url: ${OTLP_METRICS_URL:}
        headers:
          Authorization: Basic ${OTLP_METRICS_AUTH:}
        step: 60s

# Server - production settings
server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# Application settings
navilla:
  notification:
    batch-day: SUNDAY
    batch-hour: 18
    random-delay-hours: 6
  cors:
    allowed-origins:
      - https://navilla.app
      - https://www.navilla.app
      - https://navilla-production.up.railway.app
    allowed-origin-patterns:
      - https://*.up.railway.app
      - https://*.railway.app
