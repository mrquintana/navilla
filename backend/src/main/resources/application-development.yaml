# Navilla Backend - Development Configuration
# Profile: development
# Usage: ./mvnw spring-boot:run -Dspring-boot.run.profiles=development

spring:
  # DevTools
  devtools:
    restart:
      enabled: true
      poll-interval: 2s
    livereload:
      enabled: true

  # Database - local or Supabase dev project
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/navilla_dev}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  # JPA - more verbose for debugging
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Logging - verbose for development
logging:
  level:
    root: INFO
    app.navilla: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.hibernate.orm.jdbc.bind: TRACE

# Management endpoints - all exposed for dev
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

# Application settings
navilla:
  # Shorter batch intervals for testing
  notification:
    batch-day: MONDAY  # More frequent for testing
    batch-hour: 10
    random-delay-hours: 1
  dev-mode: true
