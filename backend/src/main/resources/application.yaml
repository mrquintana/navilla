# Navilla Backend Configuration
# Environment-specific values should be provided via environment variables

spring:
  application:
    name: navilla-backend

  # Database Configuration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/navilla}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:5}
      minimum-idle: ${HIKARI_MIN_IDLE:1}
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1800000

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  # Security Configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_URL:https://your-project.supabase.co}/auth/v1
          jwk-set-uri: ${SUPABASE_URL:https://your-project.supabase.co}/auth/v1/.well-known/jwks.json

  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB

# Server Configuration
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    max-http-form-post-size: 1048576
  error:
    include-message: always
    include-binding-errors: always

# Actuator & Metrics Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

  # Common tags applied to every metric — visible as dimensions in Grafana
  metrics:
    tags:
      application: navilla-backend
      environment: ${SPRING_PROFILES_ACTIVE:unknown}
    distribution:
      # Export histogram buckets so histogram_quantile() works in Grafana dashboards.
      # Without this, Micrometer only emits _count/_sum; _bucket data is never sent.
      percentiles-histogram:
        http.server.requests: true
        navilla.exposure.computation.duration: true

  # OTLP export — controlled entirely by env vars, no profile dependency
  otlp:
    metrics:
      export:
        enabled: ${OTLP_METRICS_ENABLED:false}
        url: ${OTLP_METRICS_URL:http://localhost:4318/v1/metrics}
        headers:
          Authorization: Basic ${OTLP_METRICS_AUTH:}
        step: 60s
        # Use explicit bucket boundaries so histogram_quantile() PromQL works.
        # Default BASE2_EXPONENTIAL_BUCKET_HISTOGRAM is not compatible with
        # classic Prometheus histogram_quantile queries.
        histogram-flavor: EXPLICIT_BUCKET_HISTOGRAM

# Logging Configuration
logging:
  level:
    root: INFO
    app.navilla: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: INFO
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE:WARN}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOG_LEVEL_HIBERNATE:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Application-specific Configuration
navilla:
  rate-limit:
    enabled: true
    write-per-minute: 30
    read-per-minute: 120
    sensitive-per-minute: 10
    global-per-minute-per-ip: 300

  resource-caps:
    journal-entries: 10000
    partners: 500
    test-visits: 5000
    labs: 50
    connections: 500
    custom-field-templates: 10
    verification-cards: 20
    reminders: 50
    medications: 50

  # Supabase Configuration
  supabase:
    url: ${SUPABASE_URL:https://your-project.supabase.co}
    anon-key: ${SUPABASE_ANON_KEY:}
    service-key: ${SUPABASE_SERVICE_KEY:}

  # Storage configuration (Supabase Storage now, S3 later)
  storage:
    public-base-url: ${SUPABASE_URL:https://your-project.supabase.co}/storage/v1/object/public
    avatar-bucket: ${AVATAR_BUCKET:avatars}

  # Encryption Configuration
  # ENCRYPTION_PEPPER must be set via environment variable.
  # Startup validation in EncryptionService rejects blank, placeholder, or short values.
  encryption:
    pepper: ${ENCRYPTION_PEPPER:}

  # Privacy Configuration
  privacy:
    minimum-connections: 3

  exposure:
    max-depth: 5
    snapshot-ttl-days: 5
    max-exposure-degree: 3

  # Notification Configuration
  notification:
    batch-day: SUNDAY
    batch-hour: 18
    random-delay-hours: 6

  # Health Catalog Configuration
  health-catalog:
    medication-types:
      PREP_DAILY:
        label-key: "medications.type.prepDaily"
        default-frequency: DAILY
        ongoing: true
      PREP_INJECTABLE:
        label-key: "medications.type.prepInjectable"
        default-frequency: EVERY_2_MONTHS
        ongoing: true
      TREATMENT_COURSE:
        label-key: "medications.type.treatmentCourse"
        default-frequency: DAILY
        ongoing: false
      DOXY_PEP:
        label-key: "medications.type.doxyPep"
        default-frequency: AS_NEEDED
        ongoing: false
    frequencies:
      DAILY:
        hours: 24
      EVERY_2_MONTHS:
        days: 60
      WEEKLY:
        days: 7
      AS_NEEDED: {}
      CUSTOM: {}
    vaccine-series:
      HPV:
        label-key: "vaccinations.type.hpv"
        total-doses: 3
        dose-intervals-days: [0, 60, 120]
      HEPATITIS_B:
        label-key: "vaccinations.type.hepatitisB"
        total-doses: 3
        dose-intervals-days: [0, 30, 150]
      MPOX:
        label-key: "vaccinations.type.mpox"
        total-doses: 2
        dose-intervals-days: [0, 28]
      HEPATITIS_A:
        label-key: "vaccinations.type.hepatitisA"
        total-doses: 2
        dose-intervals-days: [0, 180]
    testing-heuristics:
      high-activity-interval-days: 90
      moderate-activity-interval-days: 180
      high-activity-threshold: 3
      nudge-after-days: 180
    follow-up-rules:
      test-of-cure-days: 21
      window-period-default-days: 14

  # Web Push Configuration (VAPID / RFC 8292)
  push:
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    vapid-subject: ${VAPID_SUBJECT:mailto:contact@navilla.app}

  # Lab Integration Configuration
  # MOCK_LAB_BASE_URL: on Railway, set to https://api.navilla.app
  # Locally, defaults to http://localhost:8080
  labs:
    mock-base-url: ${MOCK_LAB_BASE_URL:http://localhost:${server.port:8080}}
    providers:
      - code: MOCK_DEMO_MX
        name: "Lab Demo MX"
        name-es: "Lab Demo MX"
        enabled: ${NAVILLA_DEV_MODE:false}
        base-url: "${navilla.labs.mock-base-url}/api/dev/mock-labs/demo-mx"
        website-url: "https://www.labdemomx.com"
        required-fields:
          - key: orderId
            label: "Order ID"
            label-es: "Número de orden"
          - key: patientId
            label: "Patient ID"
            label-es: "ID del paciente"
      - code: MOCK_EXPRESS
        name: "Lab Express"
        name-es: "Lab Express"
        enabled: ${NAVILLA_DEV_MODE:false}
        base-url: "${navilla.labs.mock-base-url}/api/dev/mock-labs/express"
        website-url: "https://www.labexpress.com"
        required-fields:
          - key: orderId
            label: "Order ID"
            label-es: "Número de orden"

  # Dev-only features
  dev-mode: ${NAVILLA_DEV_MODE:false}

  # Email Configuration
  email:
    enabled: ${EMAIL_ENABLED:false}
    from: ${EMAIL_FROM:no-reply@navilla.app}
    from-name: ${EMAIL_FROM_NAME:Navilla}
    reply-to: ${EMAIL_REPLY_TO:contact@navilla.app}
    sendgrid-api-key: ${SENDGRID_API_KEY:}

  # No allowed-origin-patterns here: anyone can deploy to *.up.railway.app, so
  # wildcard Railway origins are only acceptable in the staging profile (see
  # application-staging.yaml). CorsConfigurationPolicyTest enforces this.
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
      - https://navilla.app
      - https://www.navilla.app
      - https://navilla-production.up.railway.app
