# Navilla Backend Configuration
# Environment-specific values should be provided via environment variables

spring:
  application:
    name: navilla-backend

  # Database Configuration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/navilla}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:5}
      minimum-idle: ${HIKARI_MIN_IDLE:1}
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1800000

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  # Security Configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_URL:https://your-project.supabase.co}/auth/v1
          jwk-set-uri: ${SUPABASE_URL:https://your-project.supabase.co}/auth/v1/.well-known/jwks.json

# Server Configuration
server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# Actuator & Metrics Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

  # Common tags applied to every metric — visible as dimensions in Grafana
  metrics:
    tags:
      application: navilla-backend
      environment: ${SPRING_PROFILES_ACTIVE:unknown}
    distribution:
      # Export histogram buckets so histogram_quantile() works in Grafana dashboards.
      # Without this, Micrometer only emits _count/_sum; _bucket data is never sent.
      percentiles-histogram:
        http.server.requests: true
        navilla.exposure.computation.duration: true

  # OTLP export — controlled entirely by env vars, no profile dependency
  otlp:
    metrics:
      export:
        enabled: ${OTLP_METRICS_ENABLED:false}
        url: ${OTLP_METRICS_URL:http://localhost:4318/v1/metrics}
        headers:
          Authorization: Basic ${OTLP_METRICS_AUTH:}
        step: 60s
        # Use explicit bucket boundaries so histogram_quantile() PromQL works.
        # Default BASE2_EXPONENTIAL_BUCKET_HISTOGRAM is not compatible with
        # classic Prometheus histogram_quantile queries.
        histogram-flavor: EXPLICIT_BUCKET_HISTOGRAM

# Logging Configuration
logging:
  level:
    root: INFO
    app.navilla: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: INFO
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE:WARN}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOG_LEVEL_HIBERNATE:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Application-specific Configuration
navilla:
  # Supabase Configuration
  supabase:
    url: ${SUPABASE_URL:https://your-project.supabase.co}
    anon-key: ${SUPABASE_ANON_KEY:}
    service-key: ${SUPABASE_SERVICE_KEY:}

  # Storage configuration (Supabase Storage now, S3 later)
  storage:
    public-base-url: ${SUPABASE_URL:https://your-project.supabase.co}/storage/v1/object/public
    avatar-bucket: ${AVATAR_BUCKET:avatars}

  # Encryption Configuration
  encryption:
    pepper: ${ENCRYPTION_PEPPER:change-this-in-production}

  # Privacy Configuration
  privacy:
    minimum-connections: 3

  exposure:
    max-depth: 5
    snapshot-ttl-days: 5
    max-exposure-degree: 3

  # Notification Configuration
  notification:
    batch-day: SUNDAY
    batch-hour: 18
    random-delay-hours: 6

  # Dev-only features
  dev-mode: ${NAVILLA_DEV_MODE:false}

  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
      - http://54.159.90.88
      - https://navilla.app
      - https://www.navilla.app
      - https://navilla-production.up.railway.app
    allowed-origin-patterns:
      - https://*.up.railway.app
      - https://*.railway.app
