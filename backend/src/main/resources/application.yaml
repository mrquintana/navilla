# Navilla Backend Configuration
# Environment-specific values should be provided via environment variables

spring:
  application:
    name: navilla-backend

  # Database Configuration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/navilla}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  # Security Configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_URL:https://your-project.supabase.co}/auth/v1
          jwk-set-uri: ${SUPABASE_URL:https://your-project.supabase.co}/auth/v1/.well-known/jwks.json

# Server Configuration
server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Logging Configuration
logging:
  level:
    root: INFO
    app.navilla: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Application-specific Configuration
navilla:
  # Supabase Configuration
  supabase:
    url: ${SUPABASE_URL:https://your-project.supabase.co}
    anon-key: ${SUPABASE_ANON_KEY:}
    service-key: ${SUPABASE_SERVICE_KEY:}

  # Storage configuration (Supabase Storage now, S3 later)
  storage:
    public-base-url: ${SUPABASE_URL:https://your-project.supabase.co}/storage/v1/object/public
    avatar-bucket: ${AVATAR_BUCKET:avatars}

  # Encryption Configuration
  encryption:
    pepper: ${ENCRYPTION_PEPPER:change-this-in-production}

  # Privacy Configuration
  privacy:
    minimum-connections: 3

  exposure:
    max-depth: 5
    snapshot-ttl-days: 5
    max-exposure-degree: 3

  # Notification Configuration
  notification:
    batch-day: SUNDAY
    batch-hour: 18
    random-delay-hours: 6

  # Dev-only features
  dev-mode: ${NAVILLA_DEV_MODE:false}

  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
      - http://54.159.90.88
      - https://navilla.app
      - https://www.navilla.app
      - https://navilla-production.up.railway.app
    allowed-origin-patterns:
      - https://*.up.railway.app
      - https://*.railway.app
