# Docker Compose Production Override
# Used on AWS EC2 staging environment
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  backend:
    # Use pre-built image from GitHub Container Registry instead of building
    image: ghcr.io/mrquintana/navilla/backend:latest
    build: null  # Disable build
    environment:
      - SPRING_PROFILES_ACTIVE=staging
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:+UseG1GC -XX:+UseStringDeduplication -Djava.security.egd=file:/dev/./urandom -Dspring.profiles.active=staging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    # Use pre-built image from GitHub Container Registry instead of building
    image: ghcr.io/mrquintana/navilla/frontend:latest
    build: null  # Disable build
    depends_on:
      - backend
