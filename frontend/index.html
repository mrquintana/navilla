<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Site fonts: Plus Jakarta Sans (body) + Fraunces (display headlines) -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,100..900&display=swap" rel="stylesheet" />

    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Navilla" />

    <!-- Default SEO — overridden per page via React 19 metadata hoisting -->
    <title>Navilla — Know your exposure risk, protect your privacy</title>
    <meta name="description" content="Navilla shows you anonymized health exposure signals from your trusted network. Numbers, not names. Your privacy is our priority." />
    <link rel="canonical" href="https://www.navilla.app/" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="Navilla" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.navilla.app/" />
    <meta property="og:title" content="Navilla — Know your exposure risk, protect your privacy" />
    <meta property="og:description" content="Navilla shows you anonymized health exposure signals from your trusted network. Numbers, not names. Your privacy is our priority." />
    <meta property="og:image" content="https://www.navilla.app/images/og-default.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Navilla — Know your exposure risk, protect your privacy" />
    <meta name="twitter:description" content="Navilla shows you anonymized health exposure signals from your trusted network. Numbers, not names. Your privacy is our priority." />
    <meta name="twitter:image" content="https://www.navilla.app/images/og-default.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
