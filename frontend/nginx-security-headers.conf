# Shared security headers for every response class.
#
# nginx gotcha this file exists to solve: add_header directives are inherited
# from the server block ONLY if a location declares none of its own. Any
# location that sets e.g. Cache-Control silently drops every inherited header
# — which is how SPA routes (served via the try_files fallback into
# "location = /index.html") shipped with no CSP at all. Include this file in
# the server block AND in every location that declares its own add_header.
#
# CSP notes:
# - script-src 'self' only: the Vite build emits no inline scripts and needs
#   no eval. If a future change introduces either, fix the change, not this.
# - style-src keeps 'unsafe-inline': React style={} attributes require it.
# - HSTS has no "preload" on purpose — submitting to the preload list is a
#   hard-to-reverse decision the product owner must make explicitly.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.navilla.app; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self';" always;
