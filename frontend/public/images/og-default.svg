<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#312e81"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Subtle decorative circle -->
  <circle cx="1050" cy="100" r="300" fill="white" fill-opacity="0.03"/>
  <circle cx="150" cy="530" r="250" fill="white" fill-opacity="0.03"/>
  <!-- Wordmark -->
  <text
    x="600"
    y="280"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="96"
    font-weight="700"
    fill="white"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="-2"
  >Navilla</text>
  <!-- Tagline -->
  <text
    x="600"
    y="360"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="28"
    font-weight="400"
    fill="rgba(255,255,255,0.8)"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="0.5"
  >Your private sexual health companion</text>
  <!-- URL strip -->
  <text
    x="600"
    y="530"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="22"
    font-weight="400"
    fill="rgba(255,255,255,0.5)"
    text-anchor="middle"
    dominant-baseline="middle"
  >navilla.app</text>
</svg>
