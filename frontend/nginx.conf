# Navilla Frontend Nginx Configuration
# Optimized for SPA with security headers

worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 256;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/rss+xml application/atom+xml image/svg+xml;

    # Security: Hide nginx version
    server_tokens off;

    # Redirect non-www → www.
    # Requires adding navilla.app as a custom domain in Railway dashboard
    # so Railway routes non-www traffic to this container.
    server {
        listen 80;
        server_name navilla.app;
        include /etc/nginx/security-headers.conf;
        return 301 https://www.navilla.app$request_uri;
    }

    server {
        listen 80;
        server_name localhost www.navilla.app;
        root /usr/share/nginx/html;
        index index.html;

        # Railway terminates TLS before reaching nginx, so nginx thinks it's on
        # http://. Without this, try_files redirects (e.g. /testing-cost →
        # /testing-cost/) use http:// instead of https://, breaking mobile Safari.
        absolute_redirect off;

        # Security headers live in security-headers.conf. It MUST be re-included
        # in every location that declares its own add_header, because nginx
        # drops all inherited add_header directives the moment a location adds
        # one of its own (this is how SPA routes once shipped without CSP).
        include /etc/nginx/security-headers.conf;

        # SPA routing - serve index.html for all routes.
        # $uri/index.html catches prerendered routes (e.g. testing-cost/index.html)
        # without issuing a redirect to add a trailing slash, which breaks mobile
        # browsers when Railway terminates TLS upstream and nginx emits http://.
        location / {
            try_files $uri $uri/index.html /index.html;
        }

        # Don't cache service worker or manifest (must always be fresh).
        # MUST come before the general asset regex: nginx picks the FIRST
        # matching regex location, and sw.js would otherwise match \.(js|...)$
        # and ship with a 1-year immutable cache.
        location ~* (sw\.js|manifest\.webmanifest)$ {
            include /etc/nginx/security-headers.conf;
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Static assets caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            include /etc/nginx/security-headers.conf;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Don't cache index.html (also serves all SPA routes via try_files)
        location = /index.html {
            include /etc/nginx/security-headers.conf;
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Health check endpoint (exact match — must not catch /health-log etc.)
        location = /health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
